apiVersion: apps/v1
kind: Deployment
metadata:
  name: userassetsservice
  labels:
    app: userassetsservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: userassetsservice
  template:
    metadata:
      labels:
        app: userassetsservice
    spec:
      serviceAccountName: userassetsservice
      terminationGracePeriodSeconds: 5
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: server
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
          image: userassetsservice
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /v1/assets?user_id=health
              port: 8080
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /v1/assets?user_id=health
              port: 8080
            initialDelaySeconds: 10
          env:
            - name: PORT
              value: "8080"
            - name: UAS_DATA_DIR
              value: /data/assets
            - name: UAS_ALLOWED_MIME
              value: image/jpeg,image/png
            - name: UAS_MAX_UPLOAD_MB
              value: "16"
            - name: UAS_MAX_ASSETS_PER_USER
              value: "5"
            - name: BASE_URL
              value: "" # frontend will proxy; baseUrl empty
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: userassetsservice
  labels:
    app: userassetsservice
spec:
  type: ClusterIP
  selector:
    app: userassetsservice
  ports:
    - name: http
      port: 8001
      targetPort: 8080
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: userassetsservice
