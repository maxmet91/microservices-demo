apiVersion: apps/v1
kind: Deployment
metadata:
  name: agents
  labels:
    app: agents
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agents
  template:
    metadata:
      labels:
        app: agents
    spec:
      serviceAccountName: agents
      terminationGracePeriodSeconds: 5
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: server
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
          image: agents
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          env:
            - name: PORT
              value: "8080"
            - name: FRONTEND_ADDR
              value: "frontend:80"
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agents-api-key
                  key: GOOGLE_API_KEY
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 200m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: agents
  labels:
    app: agents
spec:
  type: ClusterIP
  selector:
    app: agents
  ports:
    - name: http
      port: 8002
      targetPort: 8080
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agents
