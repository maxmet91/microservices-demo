root = "."
tmp_dir = "tmp"

[build]
cmd = "GOCACHE=/app/tmp/gocache GOMODCACHE=/app/tmp/gomodcache TMPDIR=/app/tmp go build -o ./tmp/server ."
bin = "./tmp/server"
full_bin = "./tmp/server"
exclude_dir = ["tmp", "vendor"]
include_ext = ["go", "tpl", "tmpl", "html"]
exclude_regex = ["_test.go"]

[log]
time = true

[probe]
# Optionally wait until server is ready before reporting success
addr = "http://127.0.0.1:8080"
interval = 500 # ms
