apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - agents.yaml
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: frontend
      spec:
        template:
          spec:
            containers:
            - name: server
              env:
              - name: AGENTS_SERVICE_ADDR
                value: "agents:8002"
